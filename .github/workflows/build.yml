name: Build BerryCore
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B -ntp clean package
      - uses: actions/upload-artifact@v4
        with:
          name: BerryCore
          path: target/BerryCore-*.jar
