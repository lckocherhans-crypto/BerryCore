# =====================================================================
#  BerryCore - messages (MiniMessage format: https://docs.advntr.dev/minimessage/)
#  Placeholders look like %name%. Placeholders ending in _mm are inserted as MiniMessage.
#  PlaceholderAPI placeholders (%player_name% etc.) work in every message too.
# =====================================================================
use-prefix: true
prefix: "<gradient:#ff4d8d:#b24dff><bold>BerryCore</bold></gradient> <dark_gray>» </dark_gray>"

ui:
  close: "<gray>Close"
  confirm: "<green>Confirm"
  cancel: "<red>Cancel"
  submit: "<green>Submit"
  save: "<green>Save"
  confirm-sell-title: "<green>Sell everything?"

team-ui:
  create: "<green>Create a team"
  create-title: "<gradient:#4dc3ff:#7b4dff>Create a team</gradient>"
  name-label: "Team name"
  color-label: "Colour(s), e.g. #ff0000 #0000ff"
  accept: "<yellow>Accept invite"
  no-team-body: "<gray>You are not in a team yet. Create one or ask a friend to invite you."
  info: "<aqua>Team info"
  homes: "<green>Team homes"
  members: "<gold>Members"
  chat: "<yellow>Toggle team chat"
  invite: "<green>Invite a player"
  invite-title: "Invite a player"
  invite-label: "Player name"
  ff: "<red>Toggle friendly fire"
  color: "<light_purple>Change colour / gradient"
  color-title: "Team colour"
  rename: "<aqua>Rename team"
  rename-title: "Rename team"
  rename-label: "New name"
  disband: "<dark_red>Disband team"
  disband-title: "Disband?"
  disband-body: "Delete the team forever?"
  leave: "<red>Leave team"
  leave-title: "Leave?"
  leave-body: "Leave your team?"
  sethome: "<green>Set a home here"
  sethome-title: "Team home"
  sethome-label: "Home name"

home-ui:
  set: "<green>Set a home here"
  set-title: "New home"
  key-label: "Home id (letters/numbers)"
  name-label: "Display name (optional)"
  edit: "<aqua>Edit a home"
  buy: "<gold>Buy another home slot"
  buy-title: "<gold>Buy a home slot"
  buy-body: "Cost: %cost%"
  rename: "<aqua>Rename"
  rename-title: "Rename home"
  icon-hand: "<yellow>Icon: use the item in my hand"
  icon-name: "<yellow>Icon: type a material"
  icon-title: "Home icon"
  icon-label: "Material name"
  move: "<light_purple>Move here"
  delete: "<red>Delete"
  delete-title: "Delete home?"

team-info:
  - "<dark_gray><strikethrough>                    </strikethrough>"
  - "<gray>Team: %team_mm%"
  - "<gray>Leader: <white>%leader%"
  - "<gray>Members: <white>%members%<dark_gray>/<white>%max% <dark_gray>(<green>%online% online<dark_gray>)"
  - "<gray>Homes: <white>%homes%  <gray>Friendly fire: <white>%ff%"
  - "<dark_gray><strikethrough>                    </strikethrough>"

messages:
  # ---- general
  no-permission: "<red>You don't have permission to do that."
  players-only: "<red>Only players can use this."
  player-not-found: "<red>Unknown player <white>%name%</white>."
  player-offline: "<red>%name% is not online."
  usage: "<gray>Usage: <white>%usage%"
  reloaded: "<green>Configs reloaded."
  saved: "<green>All data saved."
  invalid-amount: "<red>That is not a valid amount."
  not-enough: "<red>You need %amount_mm%<red>."
  inventory-full: "<red>Your inventory is full."
  hold-item: "<red>Hold an item first."
  world-missing: "<red>That location's world is not loaded."
  prompt-header: "<yellow>%prompt% <gray>- type it in chat, or type <white>%cancel%</white> to abort."
  prompt-expired: "<red>That prompt timed out."
  prompt-cancelled: "<gray>Cancelled."
  tp-cooldown: "<red>Wait %seconds%s before teleporting again."
  tp-already-pending: "<red>You are already teleporting."
  tp-cancelled: "<red>Teleport cancelled because you moved."
  tp-warmup: "<yellow>Teleporting to %name_mm%<yellow> in <white>%seconds%</white>... <gray>(don't move)"
  tp-done: "<green>Teleported to %name_mm%<green>."
  settings-saved: "<green>Settings saved."

  # ---- economy
  balance: "<gray>Balance: %amount_mm%"
  balance-other: "<gray>%player%'s balance: %amount_mm%"
  pay-self: "<red>You can't pay yourself."
  pay-refused: "<red>%player% is not accepting payments."
  pay-sent: "<gray>You paid <white>%player%</white> %amount_mm%<gray>."
  pay-received: "<gray>You received %amount_mm% <gray>from <white>%player%</white>."
  baltop-header: "<gradient:#ff4d8d:#b24dff><bold>Richest players</bold></gradient>"
  baltop-line: "<gray>#%rank% <white>%player% <dark_gray>- %amount_mm%"
  eco-done: "<green>%player% now has %amount_mm%<green>."
  sold: "<green>Sold <white>%items%</white> items for %amount_mm%<green>."
  nothing-sellable: "<red>Nothing sellable there."
  sell-returned: "<yellow>Your items were returned."
  worth: "<gray>%item% is worth %amount_mm%<gray>."
  worth-none: "<red>%item% can't be sold."

  # ---- teams
  team-created: "<green>Team %team_mm%<green> created!"
  team-in-team: "<red>You are already in a team."
  team-not-in-team: "<red>You are not in a team."
  team-need-officer: "<red>Only officers and the leader can do that."
  team-need-leader: "<red>Only the team leader can do that."
  team-bad-name: "<red>Team names must be %min%-%max% characters and may not use forbidden words."
  team-exists: "<red>A team with that name already exists."
  team-bad-color: "<red>Invalid colour. Use hex like <white>#ff8800</white>, or several for a gradient: <white>#ff0000 #0000ff</white>."
  team-disbanded: "<red>Team %team_mm%<red> was disbanded."
  team-target-in-team: "<red>%player% is already in a team."
  team-full: "<red>That team is full."
  team-invited: "<green>Invited <white>%player%</white> to %team_mm%<green>."
  team-invite-received: "<green>%player% invited you to %team_mm%<green>. <click:run_command:/team accept><yellow><u>[Click to accept]</u></yellow></click>"
  team-no-invite: "<red>You have no pending invite."
  team-invite-denied: "<gray>Invite declined."
  team-member-joined: "<green>%player% joined %team_mm%<green>!"
  team-leader-cant-leave: "<red>Transfer leadership or disband the team first."
  team-left: "<gray>You left %team_mm%<gray>."
  team-member-left: "<gray>%player% left the team."
  team-target-not-member: "<red>%player% is not in your team."
  team-cant-target: "<red>You can't do that to someone of equal or higher rank."
  team-member-kicked: "<red>%player% was kicked from the team."
  team-kick-notify: "<red>You were kicked from %team_mm%<red>."
  team-role-changed: "<yellow>%player% is now <white>%role%</white>."
  team-renamed: "<green>Team renamed to %team_mm%<green>."
  team-color-set: "<green>Team colour updated: %team_mm%"
  team-ff: "<yellow>Friendly fire is now <white>%state%</white>."
  team-chat-on: "<green>Team chat is now <bold>ON</bold>. Everything you type goes to your team."
  team-chat-off: "<gray>Team chat is now <bold>OFF</bold>."
  team-home-set: "<green>Team home <white>%name%</white> set."
  team-home-deleted: "<gray>Team home <white>%name%</white> deleted."
  team-home-limit: "<red>Your team can only have %max% homes."
  team-home-none: "<red>No team home called %name%."
  team-not-found: "<red>Team not found."
  team-list-header: "<gradient:#4dc3ff:#7b4dff><bold>Teams</bold></gradient>"
  team-no-ff: "<red>Friendly fire is off for your team."

  # ---- homes
  home-bad-name: "<red>Home ids may only contain letters, numbers, - and _."
  home-blocked-world: "<red>You can't set homes in this world."
  home-limit: "<red>You are at your limit of <white>%max%</white> homes. <gray>Buy another slot with /buyhome (%hint_mm%<gray>)."
  home-set: "<green>Home <white>%name%</white> set."
  home-moved: "<green>Home <white>%name%</white> moved here."
  home-none: "<red>No home called %name%."
  home-none-set: "<red>You have no homes. Use /sethome."
  home-deleted: "<gray>Home <white>%name%</white> deleted."
  home-renamed: "<green>Home renamed to %name_mm%<green>."
  home-bad-icon: "<red>That can't be used as an icon."
  home-icon-set: "<green>Home icon set to <white>%icon%</white>."
  home-buy-max: "<red>You can't buy any more home slots."
  home-bought: "<green>Bought a home slot for %amount_mm%<green>! You can now have <white>%max%</white> homes."

  # ---- stars
  star-income: "<yellow>+%amount% star <gray>for playing! <dark_gray>(%total% total)"
  star-kill-player: "<yellow>+%amount% stars <gray>for the kill! <dark_gray>(%total% total)"
  star-kill-boss: "<yellow>+%amount% stars <gray>for slaying a boss! <dark_gray>(%total% total)"
  star-kill-mob: "<yellow>+%amount% stars"
  star-not-enough: "<red>You need %cost% stars (you have %stars%)."
  star-bought: "<green>Bought %item_mm%<green> for <yellow>%cost%</yellow> stars."
  stars-balance: "<gray>%player% has <yellow>%stars%</yellow> stars. <dark_gray>(next star in %next%s)"
  stars-top-header: "<gradient:#ffe14d:#ff9d4d><bold>Top stars</bold></gradient>"
  stars-top-line: "<gray>#%rank% <white>%player% <dark_gray>- <yellow>%stars%"
  stars-admin-done: "<green>%player% now has %stars% stars."

  # ---- market
  market-blacklisted: "<red>That item can't be listed."
  market-bad-price: "<red>Price must be between %min% and %max%."
  market-limit: "<red>You can only have %max% listings."
  market-listed: "<green>Listed <white>%amount%x %item%</white> for %price_mm%<green>."
  market-gone: "<red>That listing is gone."
  market-unlisted: "<gray>Listing removed and item returned."
  market-bought: "<green>Bought <white>%item%</white> for %price_mm% <green>from <white>%seller%</white>."
  market-sold: "<green>%buyer% bought <white>%item%</white> from your shop: +%amount_mm% <dark_gray>(tax %tax_mm%<dark_gray>)"
  market-offline-earnings: "<green>While you were away your shop earned %amount_mm%<green>."
  market-admin-cleared: "<green>Shop cleared."
  shop-renamed: "<green>Shop renamed."
  shop-icon-set: "<green>Shop icon updated."
  shop-opened: "<green>Your shop is now open."
  shop-closed: "<gray>Your shop is now closed."
