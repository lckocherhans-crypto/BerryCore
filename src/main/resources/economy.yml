# =====================================================================
#  Economy - currency: Berries
#  Player driven: server sell prices are intentionally LOW, real money is
#  made in the player market (market.yml). Raise/lower prices below.
# =====================================================================
ui:
  java: dialog               # dialog | chest   (used for /pay form etc.; Bedrock = chest/chat)
  dialog-columns: 2

starting-balance: 100

currency:
  singular: "Berry"
  plural: "Berries"
  # The default Minecraft font can't render most emoji, so the symbol is empty by default.
  symbol: ""
  # Placeholders: %symbol% %amount% %name%
  format: "<light_purple>%symbol%%amount% %name%</light_purple>"
  decimals: 2
  thousands-separator: true
  compact-above: 0           # e.g. 1000000 turns 2500000 into 2.5M. 0 = never

pay:
  minimum: 1
  tax-percent: 0
  allow-self: false
  dialog-title: "<gold>Pay a player"
  label-player: "Player name"
  label-amount: "Amount (1000, 1.5k, 2m)"

baltop:
  size: 10

hub:
  title: "<gradient:#ff4d8d:#b24dff>Berries</gradient>"
  balance: "<light_purple>Balance"
  sell: "<green>Sell Items"
  market: "<aqua>Market"
  pay: "<gold>Pay a player"
  stars: "<yellow>Star shop"
  settings: "<gray>Settings"

# ---------------------------------------------------------------------
# Quick sell (/sell hand, /sell all, /sell gui, /worth)
# ---------------------------------------------------------------------
sell-all:
  skip-hotbar: false         # true = /sell all ignores slots 1-9
sell-customized-items: false # false = items with a custom name or lore can't be sold
scale-by-durability: true    # damaged tools sell for less
default-price: 0             # price for items not listed below (0 = unsellable)
sell-blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK, SPAWNER, DRAGON_EGG]

sell-multiplier-base: 1.0
# Highest matching multiplier wins
sell-multipliers:
  - permission: berrycore.sell.multiplier.vip
    multiplier: 1.25
  - permission: berrycore.sell.multiplier.mvp
    multiplier: 1.5

